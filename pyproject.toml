[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdocs-scope-mcp"
version = "0.2.0"
description = "MCP server for hierarchical, section-scoped editing of large Google Docs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["mcp", "google-docs", "google-drive", "llm", "ai-agents"]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
    "fastmcp>=2.10.0",
    "pydantic~=2.13",
    "mistune~=3.2",
    "beautifulsoup4~=4.15",
    "rich",
    "typing-extensions",
]

[project.scripts]
gdocs-scope-mcp = "gdocs_scope_mcp.server:main"
gdocs-scope-mcp-auth = "gdocs_scope_mcp.auth_setup:main"

[project.urls]
Homepage = "https://github.com/dm0/gdocs-scope-mcp"
Repository = "https://github.com/dm0/gdocs-scope-mcp"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
