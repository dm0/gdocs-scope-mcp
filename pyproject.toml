[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdocs-scope-mcp"
dynamic = ["version"]
description = "MCP server for hierarchical, section-scoped editing of large Google Docs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["mcp", "google-docs", "google-drive", "llm", "ai-agents"]
dependencies = [
    "filelock>=3.16",
    "platformdirs>=4",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
    "fastmcp>=2.10.0",
    "pydantic~=2.13",
    "pydantic-settings>=2.6",
    "pygments>=2.19",
    "mistune~=3.2",
    "beautifulsoup4~=4.15",
    "rich",
    "typing-extensions",
]

[project.scripts]
gdocs-scope-mcp = "gdocs_scope_mcp.server:main"
gdocs-scope-mcp-auth = "gdocs_scope_mcp.auth_setup:main"

[project.urls]
Homepage = "https://github.com/dm0/gdocs-scope-mcp"
Repository = "https://github.com/dm0/gdocs-scope-mcp"

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["tests"]
line-length = 79

[tool.ruff.lint]
ignore = ["E402", "Q003", "D105", "D200", "D202", "D203", "D209", "D400", "D413",
          "TRY003", "TRY400", "PIE790", "B905", "RUF001", "PLR0913", "C901",
          "PLR0912", "PLR0915"]
select = ["E", "F", "W", "C", "I", "N", "D", "UP", "BLE", "B", "A", "C4", "EXE",
          "G", "PIE", "Q", "RET", "SIM", "ARG", "PTH", "PGH", "PL", "TRY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
